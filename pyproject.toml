[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "txy-mcp-otel-gateway"
version = "0.1.0"
description = "Metadata-only MCP tool gateway with standard OpenTelemetry export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "mcp==2.2.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.urls]
Repository = "https://github.com/terraxinyun-org/mcp-otel-gateway"
Issues = "https://github.com/terraxinyun-org/mcp-otel-gateway/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
mcp-otel-gateway = "mcp_otel_gateway.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_otel_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
